[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbdetect"
version = "0.1.0"
description = "Industrial-grade PCB Defect Detection System (DeepPCB Benchmark & Quality Control)"
authors = [
    { name = "PCBDetect Engineering Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pydantic>=2.0.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "ipykernel>=6.25.0",
    "notebook>=7.0.0",
]
deeplearning = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.0.0",
    "albumentations>=1.3.0",
]
serving = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "onnxruntime>=1.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "data",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F841"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
