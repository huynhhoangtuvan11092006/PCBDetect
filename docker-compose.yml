version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pcbdetect-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/feedback:/app/data/feedback
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: pcbdetect-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://api:8000

networks:
  default:
    name: pcbdetect-network
